<style>
:root{
  --burgundy:#663333; --terra:#C46A4A; --rose:#E8C3BE; --rose-soft:#F6E7E4;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#2A1F1F; --muted:#6E5C5A; --line:#E6CFCA;
  --accent:#663333; --on-accent:#FFFFFF; --chip:var(--rose-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1414; --surface:#281B1B; --ink:#F6EDEB; --muted:#C9B3AF; --line:#3D2A2A;
    --accent:#E8C3BE; --on-accent:#3A1E1E; --chip:#3A2626; --rose-soft:#3A2626;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1414; --surface:#281B1B; --ink:#F6EDEB; --muted:#C9B3AF; --line:#3D2A2A;
  --accent:#E8C3BE; --on-accent:#3A1E1E; --chip:#3A2626; --rose-soft:#3A2626;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}

/* nav */
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:24px;height:62px}
.brand{font-family:"Bricolage Grotesque";font-weight:700;text-decoration:none;color:var(--accent);margin-right:auto}
nav a.nl{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav a.nl:hover{color:var(--ink)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px}
@media (max-width:640px){nav a.nl{display:none}}

/* hero */
.hero{padding:88px 0 56px}
.hero h1{font-size:clamp(46px,8vw,104px);font-weight:800;letter-spacing:-.03em;color:var(--accent)}
.hero h1 span{display:block;color:var(--accent)}
.role{font-size:clamp(18px,2.2vw,22px);font-weight:600;margin:24px 0 10px;color:var(--accent)}
.lede{max-width:62ch;color:var(--muted);font-size:19px;margin:0}
.proof{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0 0;padding:0;list-style:none}
.proof li{background:var(--chip);border-radius:999px;padding:8px 16px;font-size:15px}
.proof b{color:var(--accent);font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;margin-right:4px}
.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px;border:1.5px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{color:var(--accent)}
.btn:hover{filter:brightness(1.08)}

section{padding:72px 0;border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sh h2{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.02em;color:var(--accent)}
.sh p{margin:0;color:var(--muted);max-width:52ch}

/* featured */
.feat{background:var(--rose-soft);border-radius:28px;padding:40px;display:grid;gap:28px}
.feat h3{font-size:clamp(26px,3.4vw,38px);font-weight:700;color:var(--accent)}
.feat p{margin:0;max-width:68ch;color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--surface);border-radius:14px;padding:14px 12px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);font-family:"Bricolage Grotesque";font-weight:700;font-size:13px;color:var(--accent);opacity:.6}
.steps li b{display:block;font-family:"Bricolage Grotesque";font-size:16px;color:var(--accent);margin:2px 0 4px}
.steps li span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
.steps li:last-child{background:var(--accent)}
.steps li:last-child b,.steps li:last-child span,.steps li:last-child::before{color:var(--on-accent)}
.feat .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.feat .kpi{background:var(--surface);border-radius:16px;padding:16px}
.feat .kpi b{display:block;font-family:"Bricolage Grotesque";font-size:28px;color:var(--accent)}
.feat .kpi span{font-size:14px;color:var(--muted)}
.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.decisions li{border:1.5px solid var(--rose);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.decisions li strong{display:block;color:var(--accent);font-weight:600}
@media (max-width:900px){.steps{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.feat{padding:22px}.feat .kpis{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}}

/* filters & cards */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters button,.chip{font:inherit;font-size:15px;border:1.5px solid var(--rose);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer}
.filters button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.active-skill{min-height:26px;color:var(--muted);font-size:15px;margin-bottom:16px}
.active-skill button{font:inherit;background:none;border:0;color:var(--terra);cursor:pointer;text-decoration:underline;padding:0 0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card[hidden]{display:none}
.vig{height:132px;padding:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--rose-soft)}
.vig.t{background:color-mix(in srgb,var(--rose) 55%,var(--bg))}
.vig svg{width:46px;height:46px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;align-self:flex-start}
.vig .stat{text-align:right}
.vig .stat b{display:block;font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;line-height:1;color:var(--accent)}
.vig .stat span{font-size:13px;color:var(--muted)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:20px;font-weight:700;color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;gap:8px}
.badge{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--accent)}
.badge.personal{background:transparent;border:1.5px solid var(--terra);color:var(--terra)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.read{font-size:14px;font-weight:600;color:var(--accent)}

/* skills */
.skillgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px 36px}
.skillgroups h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.proven::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.chip.proven[aria-pressed="true"]::before{background:var(--on-accent)}
span.chip{cursor:default;color:var(--muted)}
.hint{color:var(--muted);font-size:15px;margin:0 0 24px}

/* approach */
.xp{display:grid;grid-template-columns:220px 1fr;gap:8px 40px;padding:28px 0;border-top:1px solid var(--line)}
.xp:first-of-type{border-top:0;padding-top:0}
.xp .when{color:var(--muted);font-size:15px}
.xp .org{font-family:"Bricolage Grotesque";font-weight:700;color:var(--accent);font-size:15px;margin-top:4px}
.xp h3{font-size:22px;color:var(--accent);margin-bottom:6px}
.xp p{margin:0 0 10px;color:var(--muted);max-width:66ch}
.xp ul{margin:0;padding-left:18px;color:var(--ink)}
.xp li{margin:4px 0}
@media (max-width:720px){.xp{grid-template-columns:1fr}}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.principles div{border-left:3px solid var(--accent);padding:4px 0 4px 18px}
.principles h3{font-size:20px;margin-bottom:6px;color:var(--accent)}
.principles p{margin:0;color:var(--muted)}

footer{padding:72px 0 56px;border-top:1px solid var(--line)}
footer h2{font-size:clamp(30px,4vw,44px);margin-bottom:12px;color:var(--accent)}
footer p{color:var(--muted);margin:0 0 24px;max-width:56ch}
.small{color:var(--muted);font-size:14px;margin-top:48px}

/* language switch */
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:600 13px Figtree,sans-serif;background:none;border:0;color:var(--muted);padding:8px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hook{font-family:"Bricolage Grotesque";font-weight:500;font-size:clamp(20px,2.4vw,26px);color:var(--accent);max-width:40ch;margin:28px 0 0;padding-left:18px;border-left:3px solid var(--rose)}

/* cards are buttons now */
button.card{font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;width:100%}

/* detail panel */
dialog#detail{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100%);background:var(--bg);color:var(--ink);box-shadow:-24px 0 60px rgba(102,51,51,.18)}
dialog#detail::backdrop{background:rgba(42,31,31,.35)}
dialog#detail[open]{animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dhead{background:var(--rose-soft);padding:28px 28px 24px;position:relative}
.dhead svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dhead h2{font-size:28px;color:var(--accent);margin:14px 0 10px;padding-right:40px}
.dclose{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--rose);background:var(--surface);color:var(--accent);font-size:20px;cursor:pointer}
.dbody{padding:24px 28px 40px}
.dstat{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.dstat b{font-family:"Bricolage Grotesque";font-weight:800;font-size:40px;color:var(--accent);line-height:1}
.dstat span{color:var(--muted)}
.dblock{margin:0 0 20px}
.dblock h3{font-size:15px;color:var(--accent);margin-bottom:6px;font-weight:700}
.dblock p{margin:0}
.dskills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 28px}
.dskills span{font-size:13px;border:1px solid var(--rose);border-radius:999px;padding:3px 10px;color:var(--muted)}
.dnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.dnav button{font:600 14px Figtree,sans-serif;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0}
@media (max-width:640px){dialog#detail{width:100%;max-width:100%;margin:0}.dhead,.dbody{padding-left:18px;padding-right:18px}}

.hero h1{font-size:clamp(38px,5.6vw,68px)!important;letter-spacing:-.02em}
.hero h1 span{display:inline!important}
.proof li{color:var(--accent);font-weight:500}
.vig{align-items:flex-end}
.vig .label{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;color:var(--accent);text-align:right;max-width:60%;line-height:1.2}
.dlinks{display:flex;flex-wrap:wrap;gap:10px}
.dlinks [hidden],.dnote[hidden]{display:none}
.dnote{color:var(--muted);font-size:14px;margin:10px 0 0}
.dkind{color:var(--muted);margin:0 0 22px;font-style:italic}
.xp .where{color:var(--muted);font-size:14px}
.edu{display:grid;grid-template-columns:220px 1fr;gap:4px 40px;padding:16px 0;border-top:1px solid var(--line)}
.edu:first-child{border-top:0}
.edu h3{font-size:19px;color:var(--accent)}
.edu p{margin:2px 0 0;color:var(--muted)}
.interests{margin-top:48px}
.interests h3{font-size:18px;color:var(--accent);margin-bottom:12px}
@media (max-width:720px){.edu{grid-template-columns:1fr}}

.hero h1{font-size:clamp(40px,6vw,76px)!important;color:var(--accent)}
.hname{font-family:"Bricolage Grotesque";font-weight:700;font-size:clamp(22px,2.6vw,30px);color:var(--ink);margin:14px 0 0}
.tagline{font-size:clamp(18px,2vw,22px);font-weight:500;color:var(--muted);margin:22px 0 0;max-width:52ch}
</style>
</head>

<section aria-labelledby="all-projects">

<section id="approach">
  <div class="wrap">
    <div class="sh"><h2 data-i18n="ap_h"></h2></div>
    <div class="principles">

</main>

<script>
const BASE="https://github.com/soley000/omr-portfolio/tree/main/projects/";
const ICON={

 {org:"Renault Group",where:"Le Plessis-Robinson",

 {school:"Nexa Digital School · Paris",en:{title:"Master's in Data & Artificial Intelligence: level 7 (RNCP 41813)",when:"2024 – 2026"},fr:{title:"Mastère Data & Intelligence Artificielle : niveau 7 (RNCP 41813)",when:"2024 – 2026"}},

const groups=[
 ["g_prog",["Python","SQL","Pandas","NumPy","PostgreSQL","Pydantic"]],
 ["g_de",["Data Pipelines","ETL","Data Quality","Data Transformation","Data Modeling","Data Anonymization","dbt","DuckDB"]],
 ["g_ml",["scikit-learn","Supervised Learning","Feature Engineering","Time Series","Cross-Validation","Model Evaluation","Model Deployment","MLflow","MLOps","Monitoring"]],
 ["g_cv",["PyTorch","OpenCV","YOLO","DETR","OWL-ViT","Object Detection","Transformers","Vision-Language Models","Video Quality Metrics","Multimodal AI"]],
 ["g_gen",["LLMs","AI Agents","Tool Calling","LLM Evaluation","World Models","Prompt Engineering","Hallucination Detection","Benchmarking"]],
 ["g_cloud",["GCP","Docker","FastAPI","CI/CD","Streamlit","Git","Data Visualization","Agile / Scrum"]]
];
// any skill cited in a project but missing from the groups is added automatically
const listed=new Set(groups.flatMap(g=>g[1]));
const extra=[...new Set(projects.flatMap(p=>p.skills))].filter(s=>!listed.has(s));
if(extra.length)groups.push(["g_other",extra]);

let lang="en",domain="all",skill=null,current=null;
const $=id=>document.getElementById(id);
const tr=k=>T[lang][k]||k;
const used=s=>projects.some(p=>p.skills.includes(s));

function renderStatic(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=tr(el.dataset.i18n));
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
 $("xpList").innerHTML=XP.map(x=>{const c=x[lang];return `<article class="xp"><div><div class="when">${c.when}</div><div class="org">${x.org}</div><div class="where">${x.where}</div></div><div><h3>${c.title}</h3><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></div></article>`}).join("");
 $("eduList").innerHTML=EDU.map(e=>{const c=e[lang];return `<div class="edu"><div class="when">${c.when}</div><div><h3>${c.title}</h3><p>${e.school}</p></div></div>`}).join("");
 $("grid").innerHTML=projects.map((p,i)=>{const c=p[lang];return `
 <button class="card" id="p-${p.id}" data-open="${p.id}" aria-haspopup="dialog">
  <div class="vig ${i%2?"t":""}" aria-hidden="true"><svg viewBox="0 0 48 48">${ICON[p.icon]}</svg><div class="label">${c.statL}</div></div>
  <div class="body">
   <h3>${c.title}</h3><p>${c.desc}</p>
   <div class="tags">${p.skills.slice(0,4).map(s=>`<span>${s}</span>`).join("")}</div>
   <div class="meta"><span class="badge ${p.kind==="personal"?"personal":""}">${tr(p.kind)}</span><span class="read">${tr("read")}</span></div>
  </div></button>`}).join("");
 if($("skillgroups"))$("skillgroups").innerHTML=groups.map(([g,list])=>`<div><h3>${tr(g)}</h3><div class="chips">${
  list.filter(used).map(s=>`<button class="chip proven" aria-pressed="false" data-skill="${s}">${s}</button>`).join("")}</div></div>`).join("");
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
 document.querySelectorAll(".chip[data-skill]").forEach(b=>b.onclick=()=>{skill=skill===b.dataset.skill?null:b.dataset.skill;domain="all";filter();if(skill)$("all-projects").scrollIntoView()});
 filter();
 if(current&&$("detail").open)fillDetail(current);
}
function filter(){
 projects.forEach(p=>{$("p-"+p.id).hidden=!((domain==="all"||p.domains.includes(domain))&&(!skill||p.skills.includes(skill)))});
 document.querySelectorAll(".filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.domain===domain));
 document.querySelectorAll(".chip[data-skill]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.skill===skill));
 if($("skillState"))$("skillState").innerHTML=skill?`${tr("showing")} <b>${skill}</b>.<button id="clr">${tr("show_all")}</button>`:"";
 if(skill&&$("clr"))$("clr").onclick=()=>{skill=null;filter()};
}
function fillDetail(id){
 const i=projects.findIndex(p=>p.id===id),p=projects[i],c=p[lang];current=id;
 $("dIcon").innerHTML=ICON[p.icon];$("dTitle").textContent=c.title;
 $("dBadge").textContent=tr(p.kind);$("dBadge").className="badge "+(p.kind==="personal"?"personal":"");
 $("dStatL").textContent=c.statL;
 $("dProblem").textContent=c.problem;$("dApproach").textContent=c.approach;$("dResult").textContent=c.result;
 $("dSkills").innerHTML=p.skills.map(s=>`<span>${s}</span>`).join("");
 $("dLink").href=BASE+p.path;$("dLink").innerHTML=tr("dl_read");
 $("dDemo").hidden=$("dNote").hidden=!p.demo;if(p.demo){$("dDemo").href=p.demo;$("dNote").innerHTML=tr(p.demoNote||"dl_note");}
 const prev=projects[(i-1+projects.length)%projects.length],next=projects[(i+1)%projects.length];
 $("dPrev").textContent=tr("prev")+" "+prev[lang].title.split(":")[0].trim();$("dPrev").onclick=()=>fillDetail(prev.id);
 $("dNext").textContent=next[lang].title.split(":")[0].trim()+" "+tr("next");$("dNext").onclick=()=>fillDetail(next.id);
 $("detail").querySelector(".dbody").scrollTop=0;
}
function openDetail(id){fillDetail(id);const d=$("detail");if(!d.open)d.showModal();}
$("dClose").onclick=()=>$("detail").close();
$("detail").addEventListener("click",e=>{if(e.target===$("detail"))$("detail").close()});
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{domain=b.dataset.domain;skill=null;filter()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){}renderStatic()});

try{const l=localStorage.getItem("lang");lang=l||((navigator.language||"").toLowerCase().startsWith("fr")?"fr":"en")}catch(e){}
const root=document.documentElement,tb=$("theme");
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t}catch(e){}
tb.onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",root.dataset.theme)}catch(e){}};
renderStatic();
</script>
